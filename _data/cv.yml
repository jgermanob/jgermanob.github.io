- title: 💼 Experience
  type: time_table
  contents:
    - title: Research Assistant
      institution: 'Mohamed Bin Zayed University of Artificial Intelligence (MBZUAI): Natural Language Processing Department'
      year: Jan 2024 - Oct 2024
      description:
        - 'Worked on parameter-efficient fine-tuning techniques for Large Language Models (LLMs).'
        - 'Contributed to CVQA, a multicultural, multilingual question-answering benchmark, by collecting, labelling, and validating image-question pairs in Mexican Spanish and English.'
        - 'Mentor at the MBZUAI Undergraduate Research Internship Program (UGRIP).'

    - title: 'Grupo de Ingeniería Lingüística'
      institution: 'UNAM research group focusing on computational linguistics and natural language processing'
      year: 2019 - 2022
      description:
        - title: Shared task organiser.
          contents:
            - 'Participated in organising the PAR-MEX 2022 shared task: Paraphrase detection in Mexican Spanish at IberLEF 2022.'
            - 'Designed baseline experiments using a Spanish BERT-based model and Keras and Transformers libraries.'
            - 'Coordinated the codalab competition page and GitHub repository for the shared task.'
            - 'Analysed the results using the F1-score as a performance metric and the Maximum Possible Accuracy and the Coincident Failure Diversity as complementariness metrics.'
        - title: Job offers classification.
          contents:
            - 'Developed system performs multi-class classification of job offers using a recurrent neural network.'
            - 'Financed by the Mexican government, its purpose is to reduce information asymmetries between job seekers and employers.'
            - 'Model building using Keras library. It consists of a Long-short term memory layer followed by a multilayer perceptron.'
            - 'Used SMOTE, Geometric-SMOTE and ADASYN algorithms to solve the high-imbalance-class problem.'
        - title: Course instructor.
          contents:
            - 'Semester course to explain the basics of machine learning with a theoretical-practical approach.'
            - 'An eight-student group took it with different academic backgrounds from UNAM and the private sector.'
            - 'Prepared lessons using the book Artificial Intelligence with an introduction to machine learning by Richard E. Neapolitan and Xia Jiang; Kaggle datasets, the sci-kit learn library and python scripts.'
        - title: Aggressiveness detection  on Twitter.
          contents:
            - 'App that classifies Mexican Spanish tweets in aggressive or non-aggressive classes using machine learning and python.'
            - 'Uses multiple types of n-grams such as character n-grams, word n-grams, and aggressive words n-grams as features.'
            - 'Implements a support vector machine as a classifier with SciKit-learn and microTC framework for parameter optimization.'
            - 'Achieved an F1-score of 0.4549, 5th place of 26 competitors at MEX-A3T 2019 aggressiveness identification task.'

